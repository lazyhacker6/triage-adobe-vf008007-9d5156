name: Fork Write Token Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe contents:write from fork PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE=$(curl -s -o /tmp/w.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Content-Type: application/json' -d '{"ref":"refs/heads/probe-fork-write-token","sha":"a1ea5cee26fb84ab139e9a4413819e27df949a5a"}' https://api.github.com/repos/PDFtoMark/triage-adobe-vf008007-9d5156/git/refs)
          echo "PROBE_FORK_WRITE_POST_REF=${CODE}"
          head -c 200 /tmp/w.json
